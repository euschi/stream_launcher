// stream-launcher: script di avvio del runtime (la prima riga deve essere un commento).
// Importa nel gestore password del profilo i login preparati dal launcher
// (stream-launcher-logins.json, permessi 600) e cancella subito il file.
// Nel contesto dell'autoconfig ci sono Services, ChromeUtils e Components, ma non
// IOUtils, PathUtils o console: si usano nsIFile e gli stream di file.
(function () {
  const FILE = "stream-launcher-logins.json";
  const Ci = Components.interfaces;
  const Cc = Components.classes;

  function log(message) {
    Services.console.logStringMessage("stream-launcher: " + message);
  }

  function readAndRemove(file) {
    const { NetUtil } = ChromeUtils.importESModule("resource://gre/modules/NetUtil.sys.mjs");
    const stream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    try {
      stream.init(file, 0x01, 0, 0);
      return JSON.parse(NetUtil.readInputStreamToString(stream, stream.available(), { charset: "UTF-8" }));
    } finally {
      stream.close();
      file.remove(false);  // le password in chiaro non restano su disco
    }
  }

  async function importLogins() {
    const file = Services.dirsvc.get("ProfD", Ci.nsIFile);
    file.append(FILE);
    if (!file.exists()) {
      return;
    }
    const entries = readAndRemove(file);
    const LoginInfo = Components.Constructor(
      "@mozilla.org/login-manager/loginInfo;1", Ci.nsILoginInfo, "init");
    const existing = await Services.logins.getAllLogins();
    let added = 0;
    let updated = 0;
    for (const e of entries) {
      const fresh = new LoginInfo(e.origin, e.formActionOrigin, null, e.username,
                                  e.password, e.usernameField, e.passwordField);
      const same = existing.find(
        (l) => l.origin === e.origin && l.username === e.username && !l.httpRealm);
      if (!same) {
        await Services.logins.addLoginAsync(fresh);
        added++;
      } else if (same.password !== e.password) {
        Services.logins.modifyLogin(same, fresh);
        updated++;
      }
    }
    log(`login aggiunti ${added}, aggiornati ${updated}`);
  }

  Services.obs.addObserver(function onStartup() {
    Services.obs.removeObserver(onStartup, "final-ui-startup");
    importLogins().catch((err) => Components.utils.reportError(err));
  }, "final-ui-startup");
})();
