<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     width="256" height="256">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24202A"/>
      <stop offset="1" stop-color="#121018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9F1C"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#background)"/>

  <!-- Independent streaming windows -->
  <rect x="34" y="63" width="112" height="105"
        rx="19" fill="#FF9F1C"
        transform="rotate(-12 90 115)"/>
  <rect x="110" y="63" width="112" height="105"
        rx="19" fill="#EC4899"
        transform="rotate(12 166 115)"/>

  <!-- Main launcher window -->
  <rect x="65" y="43" width="126" height="139"
        rx="23" fill="url(#accent)"/>
  <rect x="78" y="56" width="100" height="113"
        rx="14" fill="#191927"/>

  <!-- Play symbol -->
  <path d="M112 87
           Q108 85 108 92
           V133
           Q108 140 115 136
           L151 116
           Q157 112 151 108
           Z"
        fill="#FFFFFF"/>

  <!-- Launcher base -->
  <path d="M76 199 Q128 178 180 199"
        fill="none"
        stroke="url(#accent)"
        stroke-width="10"
        stroke-linecap="round"/>
</svg>
